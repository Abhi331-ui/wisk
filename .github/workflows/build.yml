name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pyflakes

      - name: Lint
        run: pyflakes wisp.py tests

      - name: Smoke test (opens every tab headlessly)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke.py

      - name: Build Wisp.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Wisp --collect-all winrt --collect-submodules screen_brightness_control --collect-submodules pycaw wisp.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\Wisp.exe release\
          Copy-Item README.txt release\
          Compress-Archive -Path release\* -DestinationPath Wisp-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Wisp-windows
          path: |
            dist/Wisp.exe
            README.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Wisp.exe
            Wisp-windows.zip
          generate_release_notes: true
