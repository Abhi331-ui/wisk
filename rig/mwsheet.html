<!doctype html><html><body style="margin:0">
<canvas id="c" width="2400" height="2000"></canvas>
<script type="module">
import { drawBean, MOVES, MW } from "./bean2.js";
const g = document.getElementById("c").getContext("2d");
const bg = g.createLinearGradient(0, 0, 0, 2000); bg.addColorStop(0, "#d8d2c2"); bg.addColorStop(0.62, "#c4bca8"); bg.addColorStop(0.63, "#3a3e4a"); bg.addColorStop(1, "#2a2d36"); g.fillStyle = bg; g.fillRect(0, 0, 2400, 2000);
for (let y = 1260; y < 2000; y += 90) for (let x = 0; x < 2400; x += 90) if (((x + y) / 90) % 2 === 0) { g.fillStyle = "#e8e4d8"; g.fillRect(x, y, 90, 90); }
g.fillStyle = "rgba(255,220,120,0.35)"; g.beginPath(); g.moveTo(200, 0); g.lineTo(900, 0); g.lineTo(1900, 2000); g.lineTo(1200, 2000); g.fill();
const put = (x, y, s, fn) => { g.save(); g.translate(x, y); g.scale(s, s); fn(); g.restore(); };
const sh = (x, y, w) => { g.fillStyle = "rgba(10,10,20,0.35)"; g.beginPath(); g.ellipse(x + 20, y + 4, w, 18, 0, 0, 7); g.fill(); };
const label = (t, x, y) => { g.save(); g.font = "bold 40px Arial"; g.textAlign = "center"; g.lineWidth = 10; g.strokeStyle = "#15110f"; g.strokeText(t, x, y); g.fillStyle = "#fff"; g.fillText(t, x, y); g.restore(); };
const row1 = [["percy", "stand"], ["kid", "walk"], ["boss", "stand"], ["mom", "wave"], ["girl", "cheer"]];
row1.forEach(([k, m], i) => { const x = 240 + i * 480; sh(x, 920, 110); put(x, 920, 0.9, () => drawBean(g, MW[k], MOVES[m](0.1), {})); label(MW[k].name, x, 985); });
const row2 = [["eng1", "point", "side"], ["eng2", "shrug", null], ["eng3", "hold", null], ["engw", "cheer", null], ["percy", "scared", null]];
row2.forEach(([k, m, v], i) => { const x = 240 + i * 480; sh(x, 1900, 110); put(x, 1900, 0.85, () => drawBean(g, MW[k], MOVES[m](0.1), { view: v, expr: k === "percy" ? "shock" : undefined })); label(k === "percy" ? "Percy (shock)" : MW[k].name, x, 1965); });
window.done = true;
</script></body></html>
