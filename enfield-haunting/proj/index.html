// ---------- captions ----------
const cap=document.getElementById('cap');let curCue=-1,spans=[],wt=[];
function caption(T){let ci=CUES.findIndex(q=>T>=q.start-0.05&&T<q.end+0.15);if(ci!==curCue){curCue=ci;cap.innerHTML='';spans=[];wt=[];if(ci>=0){const q=CUES[ci];const ws=q.text.split(' ');const tot=ws.reduce((a,w)=>a+w.length+1,0);let acc=0;ws.forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=w+' ';cap.appendChild(s);spans.push(s);wt.push(q.start+(acc/tot)*(q.end-q.start));acc+=w.length+1})}}
 spans.forEach((s,i)=>{const on=T>=wt[i];const hot=on&&(i==spans.length-1||T<wt[i+1]);s.className='w'+(on?' on':'')+(hot?' hot':'')})}
// ---------- frame ----------
function draw(T){const si=Math.min(SH.length-1,Math.floor(T/2));const [st,sc,cam]=SH[si];const lt=T-st;const k=ease(clamp(lt/2));
 let s=lerp(cam.s[0],cam.s[1],k),fx=lerp(cam.x[0],cam.x[1],k),fy=lerp(cam.y[0],cam.y[1],k);
 const fr=Math.floor(T*30);const shake=pulse(T,KNOCKS,.12)*22+pulse(T,SLAMS,.1)*26+pulse(T,BOOMS,.25)*16+((T>10.5&&T<13)||(T>28&&T<29.4)?5:0);
 const sx=(hash(fr,1)-.5)*shake,sy=(hash(fr,2)-.5)*shake;
 c.setTransform(1,0,0,1,0,0);c.fillStyle='#000';c.fillRect(0,0,W,H);
 c.save();c.translate(W/2+sx,H/2+sy);c.scale(s,s);c.translate(-fx,-fy);SCN[sc](lt,T);c.restore();
 // dust motes
 for(const d of DUST){c.fillStyle='rgba(220,210,190,.10)';c.beginPath();c.arc((d[0]+T*8*d[2])%W,(d[1]+Math.sin(T*.5+d[3])*40)%H,d[2],0,7);c.fill()}
 // grade: cold tint, vignette, flicker, grain
 c.globalCompositeOperation='multiply';c.fillStyle='#9fb0c8';c.fillRect(0,0,W,H);c.globalCompositeOperation='source-over';
 const vg=c.createRadialGradient(W/2,H*.45,H*.2,W/2,H*.5,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.88)');c.fillStyle=vg;c.fillRect(0,0,W,H);
 const fl=hash(fr,7);c.fillStyle=`rgba(0,0,0,${fl<.06?.35:fl*.08})`;c.fillRect(0,0,W,H);
 // cut flash: brief dip at each cut
 const cd=lt<.08?(1-lt/.08)*.7:0;if(cd){c.fillStyle=`rgba(0,0,0,${cd})`;c.fillRect(0,0,W,H)}
 c.drawImage(grains[fr%6],0,0,W,H);
 // scratches
 if(hash(fr,9)<.3){c.fillStyle='rgba(230,225,210,.12)';c.fillRect(hash(fr,10)*W,0,2,H)}
 // end title
 if(T>53.2){const a=clamp((T-53.2)/.6);c.globalAlpha=a;c.fillStyle='#a3201f';c.font='700 92px "DejaVu Serif",Georgia,serif';c.textAlign='center';c.fillText('284 GREEN STREET',W/2,820);c.fillStyle='#e8e2d4';c.font='400 44px "DejaVu Serif",Georgia,serif';c.fillText('ENFIELD · 1977–1979',W/2,900);c.globalAlpha=1}
 if(T<2.2){const a=clamp(T/.4)*clamp((2.2-T)/.4);c.globalAlpha=a;c.fillStyle='#e8e2d4';c.font='700 50px "DejaVu Serif",Georgia,serif';c.textAlign='center';c.fillText('BASED ON A TRUE STORY',W/2,260);c.globalAlpha=1}
 caption(T)}

const tl=gsap.timeline({paused:true});const proxy={t:0};
tl.to(proxy,{t:DUR,duration:DUR,ease:'none',onUpdate:()=>draw(proxy.t)},0);
