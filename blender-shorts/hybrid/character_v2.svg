    <circle cx="262" cy="486" r="2.2" fill="#cbb48c"/><circle cx="299" cy="515" r="2.2" fill="#cbb48c"/><circle cx="336" cy="544" r="2.2" fill="#cbb48c"/><circle cx="263" cy="573" r="2.2" fill="#cbb48c"/><circle cx="300" cy="512" r="2.2" fill="#cbb48c"/><circle cx="337" cy="541" r="2.2" fill="#cbb48c"/><circle cx="264" cy="570" r="2.2" fill="#cbb48c"/><circle cx="301" cy="509" r="2.2" fill="#cbb48c"/><circle cx="338" cy="538" r="2.2" fill="#cbb48c"/><circle cx="265" cy="567" r="2.2" fill="#cbb48c"/><circle cx="302" cy="506" r="2.2" fill="#cbb48c"/><circle cx="339" cy="535" r="2.2" fill="#cbb48c"/><circle cx="266" cy="564" r="2.2" fill="#cbb48c"/><circle cx="303" cy="503" r="2.2" fill="#cbb48c"/><circle cx="340" cy="532" r="2.2" fill="#cbb48c"/><circle cx="267" cy="561" r="2.2" fill="#cbb48c"/>
