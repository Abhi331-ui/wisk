  <!-- sleepy, suspicious eyes: heavy flat lids over small dark almond pupils -->
  <path d="M232,300 C236,322 278,324 282,300 Z" fill="#1f1418"/>
  <path d="M352,330 C356,354 400,356 404,332 Z" fill="#1f1418"/>
  <path d="M218,296 C240,288 270,290 292,298" fill="none" stroke="#1f1418" stroke-width="11" stroke-linecap="round"/>
  <path d="M338,326 C362,320 392,322 414,330" fill="none" stroke="#1f1418" stroke-width="11" stroke-linecap="round"/>
