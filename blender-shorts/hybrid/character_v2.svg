  <path d="M432,520 C462,600 466,700 444,780 C436,806 418,822 400,834" fill="none" stroke="#1f1418" stroke-width="13" stroke-linecap="round"/>
  <circle cx="396" cy="836" r="17" fill="#1f1418"/>

