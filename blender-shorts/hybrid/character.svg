    <circle cx="574" cy="910" r="14" fill="url(#skin)"/>
    <circle cx="588" cy="915" r="1.6" fill="#cdb88d"/><circle cx="601" cy="932" r="1.6" fill="#cdb88d"/><circle cx="614" cy="949" r="1.6" fill="#cdb88d"/><circle cx="627" cy="922" r="1.6" fill="#cdb88d"/><circle cx="600" cy="939" r="1.6" fill="#cdb88d"/><circle cx="613" cy="956" r="1.6" fill="#cdb88d"/><circle cx="626" cy="929" r="1.6" fill="#cdb88d"/><circle cx="599" cy="946" r="1.6" fill="#cdb88d"/><circle cx="612" cy="919" r="1.6" fill="#cdb88d"/><circle cx="625" cy="936" r="1.6" fill="#cdb88d"/><circle cx="598" cy="953" r="1.6" fill="#cdb88d"/><circle cx="611" cy="926" r="1.6" fill="#cdb88d"/><circle cx="624" cy="943" r="1.6" fill="#cdb88d"/><circle cx="597" cy="916" r="1.6" fill="#cdb88d"/>
  </g>
  <circle cx="634" cy="950" r="12" fill="#22161b"/>
