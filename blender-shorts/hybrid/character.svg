  <ellipse cx="505" cy="1200" rx="150" ry="22" fill="#000" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="555" cy="1392" rx="60" ry="12" fill="#000" opacity="0.4" filter="url(#soft)"/>

